<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sincronizador Renpho a Garmin</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 480px;
            width: 100%;
        }
        h1 {
            font-size: 22px;
            color: #007acc;
            margin-top: 0;
            text-align: center;
        }
        p {
            font-size: 14px;
            color: #666;
            line-height: 1.4;
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 5px;
            color: #475569;
        }
        input[type="email"], input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .file-drop-area {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 25px;
            border: 2px dashed #cbd5e1;
            border-radius: 8px;
            background-color: #f8fafc;
            cursor: pointer;
            box-sizing: border-box;
            margin-top: 5px;
        }
        .file-drop-area:hover {
            border-color: #007acc;
            background-color: #f0f9ff;
        }
        .file-input {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 100%;
            opacity: 0;
            cursor: pointer;
        }
        .btn-submit {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background-color: #007acc;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-submit:hover {
            background-color: #005fa3;
        }
        .btn-submit:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }
        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            display: none;
            line-height: 1.6;
            word-break: break-word;
        }
        .status.info {
            background-color: #eff6ff;
            color: #1e40af;
            display: block;
        }
        .status.success {
            background-color: #dcfce7;
            color: #14532d;
            display: block;
        }
        .status.error {
            background-color: #fee2e2;
            color: #7f1d1d;
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Renpho a Garmin API</h1>
    <p>Sube tu archivo CSV para sincronizar todas las métricas en Garmin Connect.</p>

    <form id="sync-form">
        <div class="form-group">
            <label for="email">Email de Garmin Connect</label>
            <input type="email" id="email" required autocomplete="username">
        </div>

        <div class="form-group">
            <label for="password">Contraseña de Garmin</label>
            <input type="password" id="password" required autocomplete="current-password">
        </div>

        <div class="form-group">
            <label>Archivo CSV de Renpho</label>
            <div class="file-drop-area">
                <span id="file-label">Toca aquí para elegir tu renpho.csv</span>
                <input class="file-input" type="file" id="csv_file" accept=".csv" required>
            </div>
        </div>

        <button type="submit" class="btn-submit" id="submit-btn">Sincronizar con Garmin</button>
    </form>

    <div id="status-box" class="status"></div>
</div>

<script>
    let extractedMetrics = null;

    function parseCSV(text) {
        let lines = text.split(/\r?\n/);
        if (lines.length < 2) return null;
        let headers = lines[0].split(',');
        let records = [];
        for (let i = 1; i < lines.length; i++) {
            let line = lines[i].trim();
            if (!line) continue;
            let current = line.split(',');
            let obj = {};
            for (let j = 0; j < headers.length; j++) {
                if (headers[j]) obj[headers[j].trim()] = current[j] ? current[j].trim() : '';
            }
            records.push(obj);
        }
        return records;
    }

    function parseNum(val) {
        if (!val || val === '--') return null;
        let n = parseFloat(val.replace(',', '.'));
        return isNaN(n) ? null : n;
    }

    function getVal(rec, keys) {
        for (let k of keys) {
            if (rec[k] !== undefined && rec[k] !== '' && rec[k] !== '--') return rec[k];
        }
        return null;
    }

    document.getElementById('csv_file').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        document.getElementById('file-label').innerText = file.name;
        const reader = new FileReader();

        reader.onload = function(evt) {
            try {
                const records = parseCSV(evt.target.result);
                if (!records || records.length === 0) throw new Error("CSV vacío o incompatible.");

                let row = null;
                for (let i = records.length - 1; i >= 0; i--) {
                    let fat = getVal(records[i], ['Porcentaje de grasa corporal(%)', 'Grasa corporal(%)', 'Body Fat(%)']);
                    if (fat) { row = records[i]; break; }
                }

                if (!row) throw new Error("No hay registros con mediciones completas en el CSV.");

                let fecha = getVal(row, ['Fecha', 'Date']);
                let hora = getVal(row, ['Hora', 'Time']) || '08:00:00';
                if (!fecha) throw new Error("No se encontró fecha en el CSV.");
                fecha = fecha.replace(/\./g, '-');

                let dt = new Date(fecha + 'T' + hora);
                let isoTime = dt.toISOString().replace('.000Z', '.000Z');

                extractedMetrics = {
                    timestamp: isoTime,
                    displayDate: `${fecha} ${hora}`,
                    weight: parseNum(getVal(row, ['Peso(kg)', 'Weight(kg)'])),
                    percent_fat: parseNum(getVal(row, ['Porcentaje de grasa corporal(%)', 'Grasa corporal(%)', 'Body Fat(%)'])),
                    percent_hydration: parseNum(getVal(row, ['Porcentaje de agua corporal(%)', 'Agua corporal(%)', 'Body Water(%)'])),
                    muscle_mass: parseNum(getVal(row, ['Masa muscular(kg)', 'Músculo(kg)', 'Muscle Mass(kg)'])),
                    bone_mass: parseNum(getVal(row, ['Masa ósea(kg)', 'Hueso(kg)', 'Bone Mass(kg)'])),
                    visceral_fat_rating: parseInt(getVal(row, ['Grasa visceral', 'Visceral Fat']) || 0, 10),
                    bmi: parseNum(getVal(row, ['IMC', 'BMI'])),
                    basal_met: parseNum(getVal(row, ['Metabolismo basal(kcal)', 'BMR(kcal)', 'TMB(kcal)'])),
                    physique_rating: parseInt(getVal(row, ['Tipo de cuerpo', 'Clasificación física', 'Physique Rating']) || 0, 10)
                };

                const box = document.getElementById('status-box');
                box.className = 'status info';
                box.innerHTML = `
                    <strong>CSV leído correctamente:</strong><br>
                    📅 Fecha: ${extractedMetrics.displayDate}<br>
                    ⚖️ Peso: ${extractedMetrics.weight} kg | 📉 Grasa: ${extractedMetrics.percent_fat}%<br>
                    🫀 Visceral: ${extractedMetrics.visceral_fat_rating} | 📊 IMC: ${extractedMetrics.bmi}
                `;
            } catch (err) {
                extractedMetrics = null;
                const box = document.getElementById('status-box');
                box.className = 'status error';
                box.innerText = "Error leyendo el archivo: " + err.message;
            }
        };
        reader.readAsText(file, 'UTF-8-SIG');
    });

    document.getElementById('sync-form').addEventListener('submit', async function(e) {
        e.preventDefault();

        const box = document.getElementById('status-box');
        const btn = document.getElementById('submit-btn');

        if (!extractedMetrics) {
            box.className = 'status error';
            box.innerText = 'Por favor, selecciona primero un archivo CSV válido.';
            return;
        }

        btn.disabled = true;
        btn.innerText = 'Conectando con Garmin...';
        box.className = 'status info';
        box.innerText = 'Autenticando en Garmin Connect y sincronizando métricas...';

        try {
            const res = await fetch('/.netlify/functions/sync', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: document.getElementById('email').value.trim(),
                    password: document.getElementById('password').value,
                    metrics: extractedMetrics
                })
            });

            if (!res.ok) {
                const errorData = await res.json().catch(() => null);
                throw new Error((errorData && errorData.error) ? errorData.error : `Error HTTP ${res.status}`);
            }

            const result = await res.json();

            if (result.success) {
                box.className = 'status success';
                box.innerHTML = `
                    <strong>¡Sincronización completada con éxito!</strong><br>
                    Los datos se han registrado en Garmin Connect.<br>
                    📅 ${extractedMetrics.displayDate} | ⚖️ ${extractedMetrics.weight} kg | 🫀 Visceral: ${extractedMetrics.visceral_fat_rating}
                `;
            } else {
                throw new Error(result.error || 'Respuesta no exitosa');
            }
        } catch (err) {
            box.className = 'status error';
            box.innerHTML = `<strong>Fallo en la sincronización:</strong> ${err.message}`;
        } finally {
            btn.disabled = false;
            btn.innerText = 'Sincronizar con Garmin';
        }
    });
</script>
</body>
</html>
