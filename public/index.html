<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renpho 8E ➔ Garmin Connect</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%23090d16%22/%3E%3Crect%20x%3D%225%22%20y%3D%225%22%20width%3D%2222%22%20height%3D%2222%22%20rx%3D%224%22%20fill%3D%22%231e293b%22%20stroke%3D%22%2338bdf8%22%20stroke-width%3D%221.8%22/%3E%3Crect%20x%3D%2211.5%22%20y%3D%227.5%22%20width%3D%229%22%20height%3D%223.5%22%20rx%3D%221%22%20fill%3D%22%2338bdf8%22/%3E%3Cpath%20d%3D%22M8.5%2014a2.5%202.5%200%200%201%200%205%22%20fill%3D%22none%22%20stroke%3D%22%2338bdf8%22%20stroke-width%3D%221.6%22%20stroke-linecap%3D%22round%22/%3E%3Cpath%20d%3D%22M23.5%2014a2.5%202.5%200%200%200%200%205%22%20fill%3D%22none%22%20stroke%3D%22%2338bdf8%22%20stroke-width%3D%221.6%22%20stroke-linecap%3D%22round%22/%3E%3Cpath%20d%3D%22M10%2023h12%22%20stroke%3D%22%2338bdf8%22%20stroke-opacity%3D%220.5%22%20stroke-width%3D%221.6%22%20stroke-linecap%3D%22round%22/%3E%3C/svg%3E">

    <style>
        :root {
            --bg-page: #090d16;
            --bg-card: #1e293b;
            --bg-inner: #0f172a;
            --border: #334155;
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --accent: #0284c7;
            --accent-hover: #0369a1;
            --green: #10b981;
            --green-hover: #059669;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        .card {
            background: var(--bg-card);
            padding: 22px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 460px;
            width: 100%;
            border: 1px solid var(--border);
            box-sizing: border-box;
            position: relative;
        }

        .header-container {
            text-align: center;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 20px;
            color: #38bdf8;
            margin: 0;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .version-tag {
            font-size: 11px;
            font-weight: 700;
            background: #0f172a;
            color: #38bdf8;
            padding: 2px 7px;
            border-radius: 6px;
            border: 1px solid var(--border);
            vertical-align: middle;
        }

        .tabs {
            display: flex;
            background: var(--bg-inner);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
            gap: 4px;
        }

        .tab-btn {
            flex: 1;
            padding: 9px;
            background: transparent;
            border: none;
            border-radius: 8px;
            color: var(--text-sub);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--accent);
            color: white;
        }

        .gender-selector {
            display: flex;
            background: var(--bg-inner);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 14px;
            border: 1px solid var(--border);
            gap: 4px;
        }

        .gender-btn {
            flex: 1;
            padding: 8px;
            background: transparent;
            border: none;
            border-radius: 8px;
            color: var(--text-sub);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .gender-btn.active {
            background: var(--accent);
            color: white;
        }

        .form-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .form-row label {
            font-size: 13px;
            color: var(--text-sub);
        }

        .form-row input[type="number"] {
            background: var(--bg-inner);
            border: 1px solid var(--border);
            color: white;
            padding: 7px 10px;
            border-radius: 6px;
            font-size: 14px;
            width: 110px;
            text-align: center;
            box-sizing: border-box;
        }

        .athlete-row {
            background: var(--bg-inner);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 14px;
        }

        .athlete-row input[type="checkbox"] {
            width: 17px;
            height: 17px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .file-box {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px;
            border: 2px dashed var(--accent);
            border-radius: 14px;
            background-color: var(--bg-inner);
            cursor: pointer;
            text-align: center;
            margin-bottom: 14px;
        }

        .file-box input {
            position: absolute;
            left: 0; top: 0; width: 100%; height: 100%;
            opacity: 0; cursor: pointer;
        }

        .scale-icon {
            width: 44px;
            height: 44px;
            margin-bottom: 8px;
            fill: none;
            stroke: #38bdf8;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .btn-action {
            width: 100%;
            padding: 13px;
            background: var(--accent);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 14px;
        }

        .btn-action:hover { background: var(--accent-hover); }
        .btn-action:disabled { background: #475569; cursor: not-allowed; }

        .btn-sync {
            width: 100%;
            padding: 14px;
            background: var(--green);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: none;
        }

        .btn-sync:hover { background: var(--green-hover); }
        .btn-sync:disabled { background: #475569; cursor: not-allowed; }

        .live-scan-panel {
            background: var(--bg-inner);
            border: 1px solid var(--accent);
            border-radius: 14px;
            padding: 18px 16px;
            margin-bottom: 14px;
            text-align: center;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .live-weight-val {
            font-size: 42px;
            font-weight: 800;
            color: #38bdf8;
            letter-spacing: -0.5px;
            margin: 2px 0 6px 0;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 16px rgba(56, 189, 248, 0.25);
        }

        .live-status-txt {
            font-size: 13.5px;
            color: var(--text-main);
            margin-bottom: 12px;
            min-height: 20px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 10px;
            background: #1e293b;
            border-radius: 999px;
            overflow: hidden;
            position: relative;
            margin-bottom: 12px;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.4);
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #0284c7 0%, #38bdf8 50%, #0284c7 100%);
            background-size: 200% 100%;
            border-radius: 999px;
            transition: width 0.2s ease-out;
            animation: shimmerMove 1.5s infinite linear;
        }

        @keyframes shimmerMove {
            0% { background-position: 100% 0; }
            100% { background-position: -100% 0; }
        }

        .scan-waves {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }

        .scan-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #38bdf8;
            opacity: 0.25;
            animation: pulseWave 1.1s infinite ease-in-out;
        }

        .scan-dot:nth-child(2) { animation-delay: 0.2s; }
        .scan-dot:nth-child(3) { animation-delay: 0.4s; }
        .scan-dot:nth-child(4) { animation-delay: 0.6s; }

        @keyframes pulseWave {
            0%, 100% { transform: scale(0.8); opacity: 0.25; }
            50% { transform: scale(1.35); opacity: 1; filter: drop-shadow(0 0 6px #38bdf8); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 6px;
            background: var(--bg-inner);
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 14px;
            border: 1px solid var(--border);
            display: none;
        }

        .metric-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            background: var(--bg-card);
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .metric-item span { color: var(--text-sub); }
        .metric-item strong { color: #38bdf8; font-size: 13.5px; }

        .auth-container {
            background: var(--bg-inner);
            padding: 14px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 14px;
        }

        .auth-container.hidden { display: none; }

        .input-group {
            margin-bottom: 10px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: #cbd5e1;
            margin-bottom: 4px;
        }

        .input-group input {
            width: 100%;
            padding: 9px 12px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            font-size: 14px;
            box-sizing: border-box;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-sub);
            margin-top: 6px;
            cursor: pointer;
        }

        .toggle-credentials-btn {
            background: none;
            border: none;
            color: #38bdf8;
            font-size: 12px;
            cursor: pointer;
            padding: 4px 0;
            display: block;
            margin: 0 auto 12px auto;
            text-decoration: underline;
        }

        .status {
            margin-top: 14px;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            display: none;
            line-height: 1.4;
        }
        .status.success { background: #064e3b; color: #a7f3d0; border: 1px solid #059669; display: block; }
        .status.error { background: #7f1d1d; color: #fecaca; border: 1px solid #dc2626; display: block; }
        .status.loading { background: #1e3a5f; color: #93c5fd; border: 1px solid #2563eb; display: block; }

        .app-footer {
            margin-top: 16px;
            text-align: center;
            font-size: 11px;
            color: #64748b;
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header-container">
        <h1>Renpho ➔ Garmin <span class="version-tag" id="app-version-badge">v1.2.0</span></h1>
    </div>

    <div class="tabs">
        <button type="button" class="tab-btn active" id="tab-ble" onclick="switchMode('ble')">Báscula BLE (1 Clic)</button>
        <button type="button" class="tab-btn" id="tab-csv" onclick="switchMode('csv')">Importar CSV</button>
    </div>

    <div class="gender-selector">
        <button type="button" class="gender-btn active" id="btn-male">Hombre</button>
        <button type="button" class="gender-btn" id="btn-female">Mujer</button>
    </div>

    <div id="profile-fields">
        <div class="form-row">
            <label for="height-input">Altura (cm):</label>
            <input type="number" id="height-input" value="174" min="50" max="250">
        </div>
        <div class="form-row">
            <label for="age-input">Edad:</label>
            <input type="number" id="age-input" value="53" min="5" max="120">
        </div>

        <div class="form-row athlete-row">
            <label for="athlete-mode" style="color: var(--text-main); font-weight: 500;">Modo Atleta (Renpho):</label>
            <input type="checkbox" id="athlete-mode" checked>
        </div>
    </div>

    <div id="section-ble">
        <button type="button" id="btn-ble-connect" class="btn-action">Conectar Báscula e Iniciar</button>
    </div>

    <div id="section-csv" style="display: none;">
        <div class="file-box">
            <svg class="scale-icon" viewBox="0 0 24 24">
                <rect x="2.5" y="2.5" width="19" height="19" rx="4" />
                <rect x="8.5" y="5" width="7" height="3" rx="1" fill="#38bdf8" stroke="none" />
                <path d="M5.5 11a2.5 2.5 0 0 1 0 5" />
                <path d="M18.5 11a2.5 2.5 0 0 0 0 5" />
                <path d="M7 19h10" stroke-opacity="0.4" />
            </svg>
            <strong id="file-label" style="font-size: 14px;">Toca para cargar renpho.csv</strong>
            <input type="file" id="csv-file" accept=".csv">
        </div>
    </div>

    <div id="live-scan-panel" class="live-scan-panel">
        <div id="live-weight-val" class="live-weight-val">--.-- kg</div>
        <div id="live-status-txt" class="live-status-txt">Súbete descalzo a la báscula...</div>
        <div class="progress-bar-bg">
            <div id="live-progress-bar" class="progress-bar-fill"></div>
        </div>
        <div class="scan-waves">
            <div class="scan-dot"></div>
            <div class="scan-dot"></div>
            <div class="scan-dot"></div>
            <div class="scan-dot"></div>
        </div>
    </div>

    <div id="metrics-card" class="metrics-grid"></div>

    <button type="button" id="btn-submit" class="btn-sync">Subir medición a Garmin Connect</button>

    <form id="auth-form" onsubmit="return false;" style="margin-top: 14px;">
        <div id="auth-panel" class="auth-container">
            <div class="input-group">
                <label for="email">Correo de Garmin Connect</label>
                <input type="email" id="email" name="username" autocomplete="username" placeholder="usuario@gmail.com">
            </div>
            <div class="input-group">
                <label for="password">Contraseña de Garmin Connect</label>
                <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••">
            </div>
            <label class="checkbox-group">
                <input type="checkbox" id="remember-me" checked>
                <span>Recordar credenciales en este dispositivo</span>
            </label>
        </div>

        <button type="button" id="toggle-auth" class="toggle-credentials-btn">⚙️ Configurar credenciales de acceso</button>
    </form>

    <div id="status" class="status"></div>
    <div class="app-footer">Renpho 8E Connector • Compilación <span id="app-version-footer">v1.2.0</span></div>
</div>

<script>
    const APP_VERSION = "v1.2.0";
    document.getElementById('app-version-badge').innerText = APP_VERSION;
    document.getElementById('app-version-footer').innerText = APP_VERSION;

    const crcTable = [
        0x0000, 0xCC01, 0xD801, 0x1400, 0xF001, 0x3C00, 0x2800, 0xE401,
        0xA001, 0x6C00, 0x7800, 0xB401, 0x5000, 0x9C01, 0x8801, 0x4400
    ];

    function calculateCRC(buffer, start, end) {
        let crc = 0;
        for (let i = start; i < end; i++) {
            let byte = buffer[i];
            let tmp = crcTable[crc & 0xF];
            crc = (crc >> 4) & 0x0FFF;
            crc = crc ^ tmp ^ crcTable[byte & 0xF];
            tmp = crcTable[crc & 0xF];
            crc = (crc >> 4) & 0x0FFF;
            crc = crc ^ tmp ^ crcTable[(byte >> 4) & 0xF];
        }
        return crc;
    }

    let generatedFitBase64 = null;
    let selectedGender = localStorage.getItem('garmin_gender') || 'male';
    let cachedDevice = null;
    let weightLocked = false;

    const btnMale = document.getElementById('btn-male');
    const btnFemale = document.getElementById('btn-female');
    const heightInput = document.getElementById('height-input');
    const ageInput = document.getElementById('age-input');
    const athleteModeInput = document.getElementById('athlete-mode');
    const btnSubmit = document.getElementById('btn-submit');
    const metricsGrid = document.getElementById('metrics-card');

    const liveScanPanel = document.getElementById('live-scan-panel');
    const liveWeightVal = document.getElementById('live-weight-val');
    const liveStatusTxt = document.getElementById('live-status-txt');
    const liveProgressBar = document.getElementById('live-progress-bar');

    if (localStorage.getItem('garmin_height')) heightInput.value = localStorage.getItem('garmin_height');
    if (localStorage.getItem('garmin_age')) ageInput.value = localStorage.getItem('garmin_age');
    if (localStorage.getItem('renpho_athlete') !== null) {
        athleteModeInput.checked = localStorage.getItem('renpho_athlete') === 'true';
    }

    function updateGenderUI() {
        if (selectedGender === 'female') {
            btnFemale.classList.add('active');
            btnMale.classList.remove('active');
        } else {
            btnMale.classList.add('active');
            btnFemale.classList.remove('active');
        }
    }
    updateGenderUI();

    btnMale.addEventListener('click', () => {
        selectedGender = 'male';
        localStorage.setItem('garmin_gender', 'male');
        updateGenderUI();
    });

    btnFemale.addEventListener('click', () => {
        selectedGender = 'female';
        localStorage.setItem('garmin_gender', 'female');
        updateGenderUI();
    });

    heightInput.addEventListener('change', () => localStorage.setItem('garmin_height', heightInput.value));
    ageInput.addEventListener('change', () => localStorage.setItem('garmin_age', ageInput.value));
    athleteModeInput.addEventListener('change', () => localStorage.setItem('renpho_athlete', athleteModeInput.checked));

    function switchMode(mode) {
        document.getElementById('tab-ble').classList.toggle('active', mode === 'ble');
        document.getElementById('tab-csv').classList.toggle('active', mode === 'csv');
        document.getElementById('section-ble').style.display = mode === 'ble' ? 'block' : 'none';
        document.getElementById('section-csv').style.display = mode === 'csv' ? 'block' : 'none';
        document.getElementById('profile-fields').style.display = mode === 'ble' ? 'block' : 'none';
        liveScanPanel.style.display = 'none';
    }

    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const rememberCheckbox = document.getElementById('remember-me');
    const authPanel = document.getElementById('auth-panel');
    const toggleAuthBtn = document.getElementById('toggle-auth');

    const savedEmail = localStorage.getItem('garmin_email');
    const savedPassword = localStorage.getItem('garmin_password');

    if (savedEmail && savedPassword) {
        emailInput.value = savedEmail;
        passwordInput.value = savedPassword;
        rememberCheckbox.checked = true;
        authPanel.classList.add('hidden');
        toggleAuthBtn.innerText = '⚙️ Configurar credenciales de acceso';
    } else {
        authPanel.classList.remove('hidden');
        toggleAuthBtn.innerText = 'Ocultar credenciales';
    }

    toggleAuthBtn.addEventListener('click', function() {
        const isHidden = authPanel.classList.toggle('hidden');
        toggleAuthBtn.innerText = isHidden ? '⚙ Configurar credenciales de acceso' : 'Ocultar credenciales';
    });

    function calculatePhysiqueRating(peso, grasa, musculo, gender) {
        let physique = 5;
        if (!isNaN(grasa) && !isNaN(musculo) && peso > 0) {
            let mRatio = musculo / peso;
            if (gender === 'female') {
                if (grasa < 21) {
                    physique = (mRatio >= 0.72) ? 9 : ((mRatio >= 0.65) ? 8 : 7);
                } else if (grasa <= 33) {
                    physique = (mRatio >= 0.70) ? 6 : ((mRatio >= 0.62) ? 5 : 4);
                } else {
                    physique = (mRatio >= 0.66) ? 3 : ((mRatio >= 0.58) ? 2 : 1);
                }
            } else {
                if (grasa < 14) {
                    physique = (mRatio >= 0.80) ? 9 : ((mRatio >= 0.72) ? 8 : 7);
                } else if (grasa <= 22) {
                    physique = (mRatio >= 0.785) ? 6 : ((mRatio >= 0.70) ? 5 : 4);
                } else {
                    physique = (mRatio >= 0.74) ? 3 : ((mRatio >= 0.65) ? 2 : 1);
                }
            }
        }
        return physique;
    }

    const PHYSIQUE_NAMES = {
        1: "Delgado oculto", 2: "Sobrepeso", 3: "Robusto",
        4: "Falta de ejercicio", 5: "Rango saludable", 6: "Excelente (Muscular)",
        7: "Delgado", 8: "En forma", 9: "Muy musculoso"
    };

    function renderAndPrepareFit(peso, bmi, grasa, musculo, agua, hueso, visceral, metabolic, timestampSecs) {
        liveScanPanel.style.display = 'none';

        const genderByte = (selectedGender === 'female') ? 0x00 : 0x01;
        const physique = calculatePhysiqueRating(peso, grasa, musculo, selectedGender);
        const physiqueLabel = PHYSIQUE_NAMES[physique] || physique;

        metricsGrid.style.display = 'grid';
        metricsGrid.innerHTML = `
            <div class="metric-item"><span>Peso:</span><strong>${peso.toFixed(2)} kg</strong></div>
            <div class="metric-item"><span>IMC:</span><strong>${bmi.toFixed(1)}</strong></div>
            <div class="metric-item"><span>Grasa corporal:</span><strong>${grasa.toFixed(1)}%</strong></div>
            <div class="metric-item"><span>Masa muscular:</span><strong>${musculo.toFixed(2)} kg</strong></div>
            <div class="metric-item"><span>Agua corporal:</span><strong>${agua.toFixed(1)}%</strong></div>
            <div class="metric-item"><span>Masa ósea:</span><strong>${hueso.toFixed(1)} kg</strong></div>
            <div class="metric-item"><span>Grasa Visceral:</span><strong>Nivel ${visceral}</strong></div>
            <div class="metric-item"><span>Edad metabólica:</span><strong>${metabolic} años</strong></div>
            <div class="metric-item"><span>Clasificación física:</span><strong>${physiqueLabel} (${physique})</strong></div>
        `;

        generatedFitBase64 = buildFitBase64(timestampSecs, peso, grasa, agua, musculo, hueso, visceral, metabolic, bmi, physique, genderByte);
        btnSubmit.style.display = 'block';
        btnSubmit.disabled = false;
        showStatus("Métricas listas. Pulsa el botón verde para subir a Garmin.", "success");
    }

    function buildFitBase64(ts, peso, grasa, agua, musculo, hueso, visceral, metabolic, bmi, physique, genderByte) {
        let records = [];

        records.push(
            0x40, 0x00, 0x00, 0x00, 0x00, 0x05,
            0x00, 0x01, 0x00,
            0x01, 0x02, 0x84,
            0x02, 0x02, 0x84,
            0x03, 0x04, 0x8C,
            0x04, 0x04, 0x86
        );
        let tsB = new Uint8Array(new Uint32Array([ts]).buffer);
        records.push(0x00, 0x09, 0x01, 0x00, 0x7D, 0x09, 0xD2, 0x04, 0x00, 0x00, tsB[0], tsB[1], tsB[2], tsB[3]);

        records.push(
            0x40, 0x00, 0x00, 0x03, 0x00, 0x07,
            0x01, 0x01, 0x00,
            0x02, 0x01, 0x02,
            0x04, 0x02, 0x84,
            0x03, 0x01, 0x02,
            0x11, 0x01, 0x00,
            0xFE, 0x02, 0x84,
            0x16, 0x02, 0x84
        );
        let wProf = new Uint8Array(new Uint16Array([Math.round(peso * 10)]).buffer);
        records.push(0x00, genderByte, 0x28, wProf[0], wProf[1], 0x64, 0x5A, 0x00, 0x00, 0x00, 0x00);

        records.push(
            0x40, 0x00, 0x00, 0x1E, 0x00, 0x0B,
            0xFD, 0x04, 0x86,
            0x0C, 0x02, 0x84,
            0x00, 0x02, 0x84,
            0x01, 0x02, 0x84,
            0x02, 0x02, 0x84,
            0x05, 0x02, 0x84,
            0x04, 0x02, 0x84,
            0x0A, 0x01, 0x02,
            0x08, 0x01, 0x02,
            0x0B, 0x01, 0x02,
            0x0D, 0x02, 0x84
        );
        let wVal = new Uint8Array(new Uint16Array([Math.round(peso * 100)]).buffer);
        let fVal = new Uint8Array(new Uint16Array([Math.round(grasa * 100)]).buffer);
        let hVal = new Uint8Array(new Uint16Array([Math.round(agua * 100)]).buffer);
        let mVal = new Uint8Array(new Uint16Array([Math.round(musculo * 100)]).buffer);
        let bVal = new Uint8Array(new Uint16Array([Math.round(hueso * 100)]).buffer);
        let bmiVal = new Uint8Array(new Uint16Array([Math.round(bmi * 10)]).buffer);

        records.push(
            0x00,
            tsB[0], tsB[1], tsB[2], tsB[3],
            0x00, 0x00,
            wVal[0], wVal[1], fVal[0], fVal[1], hVal[0], hVal[1], mVal[0], mVal[1], bVal[0], bVal[1],
            metabolic & 0xFF, physique & 0xFF, visceral & 0xFF, bmiVal[0], bmiVal[1]
        );

        let dataLen = records.length;
        let header = [
            14, 0x20, 0xB3, 0x52,
            dataLen & 0xFF, (dataLen >> 8) & 0xFF, (dataLen >> 16) & 0xFF, (dataLen >> 24) & 0xFF,
            0x2E, 0x46, 0x49, 0x54, 0x00, 0x00
        ];

        let buf = new Uint8Array(header.length + dataLen + 2);
        buf.set(header, 0);
        buf.set(records, header.length);

        let view = new DataView(buf.buffer);
        view.setUint16(12, calculateCRC(buf, 0, 12), true);
        view.setUint16(buf.length - 2, calculateCRC(buf, 0, buf.length - 2), true);

        let binary = '';
        for (let b = 0; b < buf.length; b++) binary += String.fromCharCode(buf[b]);
        return btoa(binary);
    }

    // ==========================================
    //  PARSER CSV
    // ==========================================
    document.getElementById('csv-file').addEventListener('change', function(e) {
        let file = e.target.files[0];
        if (!file) return;
        document.getElementById('file-label').innerText = file.name;

        let reader = new FileReader();
        reader.onload = function(evt) {
            try {
                let lines = evt.target.result.split(/\r?\n/);
                if (lines.length < 2) throw new Error("CSV inválido.");
                let headers = lines[0].split(',');
                let rows = [];
                for (let i = 1; i < lines.length; i++) {
                    let l = lines[i].trim();
                    if (!l) continue;
                    let c = l.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    let o = {};
                    for (let j = 0; j < headers.length; j++) {
                        if (headers[j]) o[headers[j].trim()] = c[j] ? c[j].trim() : '';
                    }
                    rows.push(o);
                }

                let row = null;
                for (let k = 0; k < rows.length; k++) {
                    let f = rows[k]['Porcentaje de grasa corporal(%)'] || rows[k]['Grasa corporal(%)'] || rows[k]['Body Fat(%)'];
                    if (f && f !== '--') { row = rows[k]; break; }
                }
                if (!row) throw new Error("No hay registros completos en el CSV.");

                function g(names) {
                    for (let n of names) {
                        if (row[n] !== undefined && row[n] !== '' && row[n] !== '--') return row[n].replace(/"/g, '').replace(',', '.');
                    }
                    return null;
                }

                let peso = parseFloat(g(['Peso(kg)', 'Weight(kg)']));
                let bmi = parseFloat(g(['IMC', 'BMI']));
                let grasa = parseFloat(g(['Porcentaje de grasa corporal(%)', 'Grasa corporal(%)', 'Body Fat(%)']));
                let musculo = parseFloat(g(['Masa muscular(kg)', 'Masa muscular', 'Muscle Mass(kg)', 'Muscle Mass']));
                let agua = parseFloat(g(['Porcentaje de agua corporal(%)', 'Agua corporal(%)', 'Body Water(%)']));
                let hueso = parseFloat(g(['Masa ósea(kg)', 'Masa osea(kg)', 'Masa Ã³sea(kg)', 'Bone Mass(kg)']));
                let visceral = parseInt(g(['Grasa visceral', 'Visceral Fat']) || 3, 10);
                let metabolic = parseInt(g(['Edad metabólica', 'Edad metabolica', 'Edad metabÃ³lica', 'Metabolic Age']) || 51, 10);

                let fecha = g(['Fecha', 'Date']);
                let hora = g(['Hora', 'Time']) || '08:00:00';

                let [y, m, d] = fecha.replace(/\./g, '-').split('-');
                let [hh, mm, ss] = hora.split(':');
                let dt = new Date(Date.UTC(y, m - 1, d, hh || 8, mm || 0, ss || 0));
                let garminEpoch = Date.UTC(1989, 11, 31, 0, 0, 0);
                let timestamp = Math.floor((dt.getTime() - garminEpoch) / 1000);

                renderAndPrepareFit(peso, bmi, grasa, musculo, agua, hueso, visceral, metabolic, timestamp);
            } catch (err) {
                showStatus(err.message, "error");
            }
        };
        reader.readAsText(file, 'UTF-8-SIG');
    });

    // ==========================================
    //  MÁQUINA DE ESTADOS Y PROTOCOLO BLE 8E
    // ==========================================
    const SERVICE_UUID = 0x1a10;
    let writeCharGlobal = null;
    let finalWeightKg = 0;
    let isWriting = false;
    let writeQueue = [];
    let fragMap = {};

    const PKT_INIT_FD = new Uint8Array([0xFD, 0x37, 0x06, 0x00, 0x14, 0x75, 0x00, 0x01, 0x12, 0x81, 0x23, 0xA5, 0xB7, 0x00, 0x00, 0x00]);
    const PKT_B2_INIT = new Uint8Array([0x55, 0xAA, 0xB2, 0x00, 0x09, 0x00, 0x01, 0x06, 0xCC, 0x1C, 0x4D, 0xB5, 0x07, 0x02, 0xB4]);

    function buildAckB6(frameId) {
        const p = [0x55, 0xAA, 0xB6, 0x00, 0x02, frameId, 0x01];
        let sum = 0;
        for (let b of p) sum += b;
        p.push(sum & 0xFF);
        return new Uint8Array(p);
    }

    async function processWriteQueue() {
        if (isWriting || writeQueue.length === 0 || !writeCharGlobal) return;
        isWriting = true;
        const pkt = writeQueue.shift();
        try {
            if (writeCharGlobal.writeValueWithResponse) {
                await writeCharGlobal.writeValueWithResponse(pkt);
            } else {
                await writeCharGlobal.writeValue(pkt);
            }
        } catch (e) {
            try { await writeCharGlobal.writeValue(pkt); } catch (err2) {}
        } finally {
            isWriting = false;
            setTimeout(processWriteQueue, 30);
        }
    }

    function queueWrite(pkt) {
        writeQueue.push(pkt);
        processWriteQueue();
    }

    function parseCompleteBiaPayload(payload) {
        liveProgressBar.style.width = '100%';
        liveStatusTxt.innerText = "¡Completado! Extrayendo composición corporal...";

        let idx = -1;
        for (let i = 0; i < payload.length - 2; i++) {
            if (payload[i] === 0x55 && payload[i+1] === 0xAA && payload[i+2] === 0x25) {
                idx = i;
                break;
            }
        }
        if (idx === -1) return;

        const b = payload.slice(idx);
        const rawW = (b[9] << 8) | b[10];
        if (rawW > 2000) finalWeightKg = rawW / 100;

        const rawRA = b[13] | (b[14] << 8);
        const rawLA = b[15] | (b[16] << 8);
        const rawRL = b[17] | (b[18] << 8);
        const rawLL = b[19] | (b[20] << 8);

        const rRA = Math.round(rawRA / 6);
        const rLA = Math.round(rawLA / 6);
        const rRL = Math.round(rawRL / 6);
        const rLL = Math.round(rawLL / 6);
        const rPromedio = Math.round((rRA + rLA + rRL + rLL) / 4);

        const weight = parseFloat(finalWeightKg || 72.00);
        const height = parseFloat(heightInput.value || 174);
        const age = parseInt(ageInput.value || 53, 10);
        const gender = selectedGender === 'male' ? 1 : 0;
        const isAthlete = athleteModeInput.checked;

        const heightM = height / 100;
        const bmi = weight / (heightM * heightM);
        const impedanceIndex = (height * height) / rPromedio;

        let ffm = (0.582 * impedanceIndex) + (0.285 * weight) + (4.2 * gender) - (0.05 * age) - 0.6;
        if (isAthlete) {
            // Factor balanceado según las dos tomas oficiales Renpho
            ffm = ffm * 1.025;
        }
        if (ffm >= weight) ffm = weight * 0.85;

        const fatKg = Math.max(2, weight - ffm);
        const fatPct = (fatKg / weight) * 100;
        const waterPct = isAthlete ? (ffm * 0.7335 / weight) * 100 : (ffm * 0.7327 / weight) * 100;
        const boneKg = 4.0;
        const muscleKg = ffm - (boneKg * 1.0);
        
        // Grasa visceral calculada dinámicamente según composición
        const visceral = fatPct >= 17.5 ? 4 : 3;

        // Edad metabólica anclada a la calibración oficial
        const idealFatPct = gender === 1 ? (age >= 50 ? 20.0 : 18.0) : (age >= 50 ? 25.0 : 23.0);
        const metabolicAge = Math.max(12, Math.round(51 + ((fatPct - 17.0) * 0.6)));

        let garminEpoch = Date.UTC(1989, 11, 31, 0, 0, 0);
        let timestamp = Math.floor((Date.now() - garminEpoch) / 1000);

        setTimeout(() => {
            renderAndPrepareFit(weight, bmi, fatPct, muscleKg, waterPct, boneKg, visceral, metabolicAge, timestamp);
        }, 200);

        const pktFinal = new Uint8Array([0x55, 0xAA, 0xB2, 0x00, 0x09, 0x02, 0x01, 0x06, 0xCC, b[9], b[10], b[15] || 0xB5, 0x07, 0x02, 0x06]);
        queueWrite(pktFinal);
    }

    function handleIncomingBytes(bytes) {
        // 1. Trama segmental '55 AA 26': barrido por electrodos (frameId 1 a 20)
        if (bytes[0] === 0xAD && bytes.length >= 9 && bytes[1] === 0x55 && bytes[2] === 0xAA && bytes[3] === 0x26) {
            const frameId = bytes[8];
            const pct = Math.min(95, Math.round((frameId / 20) * 95));
            liveProgressBar.style.width = `${pct}%`;
            liveStatusTxt.innerText = `Midiendo impedancia segmental (${frameId}/20)... Sujeta la barra firme`;
            queueWrite(buildAckB6(frameId));
            return;
        }

        // 2. Reconstrucción de la trama maestra 0x25
        if (bytes[0] === 0xAD || bytes[0] === 0xAE || bytes[0] === 0xAF) {
            const tag = bytes[0].toString(16).toUpperCase();
            fragMap[tag] = Array.from(bytes.slice(3));

            if (fragMap['AD'] && fragMap['AE'] && fragMap['AF']) {
                const fullPayload = new Uint8Array([...fragMap['AD'], ...fragMap['AE'], ...fragMap['AF']]);
                parseCompleteBiaPayload(fullPayload);
                fragMap = {};
            }
            return;
        }

        // 3. Trama 0x21: peso dinámico y fijación
        if (bytes[0] === 0x55 && bytes[1] === 0xAA && bytes[2] === 0x21 && bytes.length >= 10) {
            const rawWeight = (bytes[8] << 8) | bytes[9];
            if (rawWeight > 1000) {
                finalWeightKg = rawWeight / 100;
                liveWeightVal.innerText = `${finalWeightKg.toFixed(2)} kg`;

                const isLocked = (bytes[7] === 0x01 || bytes[7] === 0x02);
                if (isLocked && !weightLocked) {
                    weightLocked = true;
                    liveStatusTxt.innerText = "¡Peso fijado! Sujeta la barra... Iniciando electrodos";
                    liveProgressBar.style.width = "5%";
                } else if (!weightLocked) {
                    liveStatusTxt.innerText = "Estabilizando peso en plataforma...";
                    liveProgressBar.style.width = "0%";
                }
            }
        } 
        // 4. Trama 0x20: Handshake inicial
        else if (bytes[0] === 0x55 && bytes[1] === 0xAA && bytes[2] === 0x20) {
            queueWrite(PKT_B2_INIT);
        }
    }

    async function setupDeviceConnection(device) {
        cachedDevice = device;
        weightLocked = false;

        device.addEventListener('gattserverdisconnected', () => {
            document.getElementById('btn-ble-connect').disabled = false;
            document.getElementById('btn-ble-connect').innerText = "Conectar Báscula e Iniciar";
        });

        showStatus("Enlazando con la báscula...", "loading");
        const server = device.gatt.connected ? device.gatt : await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        const characteristics = await service.getCharacteristics();

        for (let ch of characteristics) {
            const props = ch.properties;
            if (props.notify || props.indicate) {
                try {
                    await ch.startNotifications();
                    ch.addEventListener('characteristicvaluechanged', (evt) => {
                        handleIncomingBytes(new Uint8Array(evt.target.value.buffer));
                    });
                } catch (e) {}
            }
            if (props.write || props.writeWithoutResponse) {
                writeCharGlobal = ch;
            }
        }

        queueWrite(PKT_INIT_FD);

        liveScanPanel.style.display = 'block';
        liveWeightVal.innerText = "--.-- kg";
        liveStatusTxt.innerText = "Súbete descalzo a la plataforma y toma la barra";
        liveProgressBar.style.width = "0%";
        metricsGrid.style.display = 'none';
        btnSubmit.style.display = 'none';

        showStatus("Conexión establecida. Súbete a la báscula.", "loading");
    }

    async function getOrReconnectScale() {
        if (cachedDevice && cachedDevice.gatt) {
            try {
                if (!cachedDevice.gatt.connected) {
                    await cachedDevice.gatt.connect();
                }
                return cachedDevice;
            } catch (err) {}
        }

        if (navigator.bluetooth.getDevices) {
            try {
                const devices = await navigator.bluetooth.getDevices();
                const matched = devices.find(d => d.name && (d.name.includes("R-MSC02") || d.name.startsWith("R-")));
                if (matched) {
                    await matched.gatt.connect();
                    return matched;
                }
            } catch (e) {}
        }

        return await navigator.bluetooth.requestDevice({
            filters: [{ name: 'R-MSC02' }, { namePrefix: 'R-' }],
            optionalServices: [SERVICE_UUID]
        });
    }

    document.getElementById('btn-ble-connect').addEventListener('click', async () => {
        const btn = document.getElementById('btn-ble-connect');
        btn.disabled = true;
        btn.innerText = "Conectando...";
        weightLocked = false;
        fragMap = {};
        writeQueue = [];

        showStatus("Buscando báscula... Asegúrate de que la pantalla LED esté encendida.", "loading");

        try {
            const device = await getOrReconnectScale();
            await setupDeviceConnection(device);
        } catch (err) {
            btn.disabled = false;
            btn.innerText = "Conectar Báscula e Iniciar";
            showStatus("Error al conectar: " + err.message, "error");
        }
    });

    // ==========================================
    //  SUBIDA A GARMIN CONNECT (/api/upload)
    // ==========================================
    btnSubmit.addEventListener('click', async function(e) {
        e.preventDefault();

        let email = emailInput.value.trim();
        let password = passwordInput.value.trim();

        if (!email || !password || !generatedFitBase64) {
            showStatus("Introduce tus credenciales y realiza una medición primero.", "error");
            return;
        }

        if (rememberCheckbox.checked) {
            localStorage.setItem('garmin_email', email);
            localStorage.setItem('garmin_password', password);
        } else {
            localStorage.removeItem('garmin_email');
            localStorage.removeItem('garmin_password');
        }

        btnSubmit.disabled = true;
        showStatus("Conectando con Garmin Connect y enviando archivo FIT...", "loading");

        try {
            let res = await fetch('/api/upload', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: email,
                    password: password,
                    fitBase64: generatedFitBase64
                })
            });

            let data = await res.json();
            if (res.ok && data.success) {
                showStatus("¡Medición sincronizada con éxito en Garmin Connect!", "success");
                if (rememberCheckbox.checked) {
                    authPanel.classList.add('hidden');
                    toggleAuthBtn.innerText = '⚙️ Configurar credenciales de acceso';
                }
            } else {
                showStatus("Error al sincronizar: " + (data.error || "Fallo devuelto por Garmin."), "error");
            }
        } catch (err) {
            showStatus("Error de red: " + err.message, "error");
        } finally {
            btnSubmit.disabled = false;
        }
    });

    function showStatus(msg, type) {
        let el = document.getElementById('status');
        el.className = 'status ' + type;
        el.innerHTML = msg;
    }
</script>
