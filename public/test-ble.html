<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renpho R-MSC02 Bridge</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #090d16;
            color: #f8fafc;
            padding: 16px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card {
            background: #1e293b;
            border-radius: 12px;
            padding: 18px;
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            margin-bottom: 14px;
        }
        h2 { margin: 0 0 12px 0; font-size: 20px; text-align: center; }
        .form-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        label { font-size: 14px; color: #94a3b8; }
        input, select {
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 15px;
            width: 120px;
            text-align: center;
        }
        button {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            font-weight: 700;
            background: #0284c7;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 8px;
        }
        button:active { background: #0369a1; }
        .display-val {
            display: flex;
            justify-content: space-around;
            text-align: center;
            margin-top: 10px;
        }
        .metric-title { font-size: 13px; color: #94a3b8; }
        .metric-num { font-size: 32px; font-weight: bold; color: #38bdf8; margin: 4px 0; }
        pre {
            background: #020617;
            padding: 12px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 11px;
            max-height: 220px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            border: 1px solid #1e293b;
            color: #cbd5e1;
            margin: 0;
            width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Perfil de Usuario</h2>
        <div class="form-row">
            <label for="gender">Sexo:</label>
            <select id="gender">
                <option value="1">Hombre</option>
                <option value="0">Mujer</option>
            </select>
        </div>
        <div class="form-row">
            <label for="height">Altura (cm):</label>
            <input type="number" id="height" value="173" min="50" max="250">
        </div>
        <div class="form-row">
            <label for="age">Edad:</label>
            <input type="number" id="age" value="53" min="5" max="120">
        </div>
        <button id="btn-conectar">Conectar e Iniciar Medición</button>
    </div>

    <div class="card">
        <div class="display-val">
            <div>
                <div class="metric-title">PESO FINAL</div>
                <div class="metric-num" id="peso-val">--.-- kg</div>
            </div>
            <div>
                <div class="metric-title">IMPEDANCIA</div>
                <div class="metric-num" id="imp-val">-- Ω</div>
            </div>
        </div>
        <div id="status" style="text-align: center; font-size: 13px; color: #94a3b8; margin-top: 8px;">
            Desconectado
        </div>
    </div>

    <div class="card" style="padding: 10px;">
        <pre id="log">Esperando conexión...</pre>
    </div>

    <script>
        const logEl = document.getElementById('log');
        const statusEl = document.getElementById('status');
        const pesoVal = document.getElementById('peso-val');
        const impVal = document.getElementById('imp-val');

        const genderInput = document.getElementById('gender');
        const heightInput = document.getElementById('height');
        const ageInput = document.getElementById('age');

        if (localStorage.getItem('r_gender')) genderInput.value = localStorage.getItem('r_gender');
        if (localStorage.getItem('r_height')) heightInput.value = localStorage.getItem('r_height');
        if (localStorage.getItem('r_age')) ageInput.value = localStorage.getItem('r_age');

        function log(msg) {
            logEl.innerText += "\n" + msg;
            logEl.scrollTop = logEl.scrollHeight;
        }

        const SERVICE_UUID = 0x1a10;
        const CHAR_NOTIFY_UUID = 0x2a10;
        const CHAR_WRITE_UUID = 0x2a11;

        // Construye el paquete de usuario con el formato estándar Chipsea CS125x / Yolanda
        function buildUserProfile(gender, age, height) {
            const p = [0x55, 0xAA, 0x22, 0x00, 0x06, 0x01, gender, age, height, 0x00];
            let sum = 0;
            for (let i = 0; i < p.length; i++) sum += p[i];
            p.push(sum & 0xFF);
            return new Uint8Array(p);
        }

        // Paquete de sincronización horaria 0x20
        function buildSyncClock() {
            const now = new Date();
            const p = [
                0x55, 0xAA, 0x20, 0x00, 0x06,
                now.getFullYear() - 2000,
                now.getMonth() + 1,
                now.getDate(),
                now.getHours(),
                now.getMinutes(),
                now.getSeconds()
            ];
            let sum = 0;
            for (let i = 0; i < p.length; i++) sum += p[i];
            p.push(sum & 0xFF);
            return new Uint8Array(p);
        }

        document.getElementById('btn-conectar').addEventListener('click', async () => {
            const gender = parseInt(genderInput.value, 10);
            const height = parseInt(heightInput.value, 10);
            const age = parseInt(ageInput.value, 10);

            localStorage.setItem('r_gender', gender);
            localStorage.setItem('r_height', height);
            localStorage.setItem('r_age', age);

            logEl.innerText = "Iniciando...";
            statusEl.innerText = "Buscando báscula...";

            try {
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'R-MSC02' }, { namePrefix: 'R-' }],
                    optionalServices: [SERVICE_UUID]
                });

                statusEl.innerText = "Conectando al servidor GATT...";
                const server = await device.gatt.connect();

                const service = await server.getPrimaryService(SERVICE_UUID);
                const notifyChar = await service.getCharacteristic(CHAR_NOTIFY_UUID);
                const writeChar = await service.getCharacteristic(CHAR_WRITE_UUID);

                await notifyChar.startNotifications();

                // Secuencia de activación secuencial
                try {
                    // 1. Handshake inicial
                    await writeChar.writeValue(new Uint8Array([0x02, 0x00, 0x00, 0x02]));
                    log("1/3 Handshake enviado.");
                    await new Promise(r => setTimeout(r, 100));

                    // 2. Sincronización de reloj (0x20)
                    await writeChar.writeValue(buildSyncClock());
                    log("2/3 Sincronización de reloj enviada.");
                    await new Promise(r => setTimeout(r, 100));

                    // 3. Envío de perfil de usuario (0x22)
                    const userPkt = buildUserProfile(gender, age, height);
                    await writeChar.writeValue(userPkt);
                    log(`3/3 Perfil enviado: ${Array.from(userPkt).map(b => b.toString(16).padStart(2, '0').toUpperCase()).join(' ')}`);
                } catch (e) {
                    log(`Aviso escritura: ${e.message}`);
                }

                statusEl.innerText = "¡Súbete descalzo y no bajes hasta completar!";
                log("Escuchando flujo de tramas...");

                notifyChar.addEventListener('characteristicvaluechanged', (event) => {
                    const bytes = new Uint8Array(event.target.value.buffer);
                    const hex = Array.from(bytes).map(b => b.toString(16).padStart(2, '0').toUpperCase()).join(' ');

                    log(`>>> TRAMA: ${hex}`);

                    if (bytes.length >= 10 && bytes[0] === 0x55 && bytes[1] === 0xAA) {
                        const rawWeight = (bytes[8] << 8) | bytes[9];
                        const wKg = (rawWeight / 100).toFixed(2);
                        pesoVal.innerText = `${wKg} kg`;

                        // Extraer valor de impedancia en ohmios
                        const imp = (bytes[6] << 8) | bytes[7];
                        if (imp > 0) {
                            impVal.innerText = `${imp} Ω`;
                            statusEl.innerText = "✓ Medición completada con impedancia";
                        }
                    }
                });

            } catch (err) {
                statusEl.innerText = "Error";
                log(`ERROR: ${err.message}`);
            }
        });
    </script>
</body>
</html>
