<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captura Renpho R-MSC02</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            padding: 20px;
            text-align: center;
        }
        button {
            padding: 15px 28px;
            font-size: 16px;
            font-weight: 600;
            background: #0284c7;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }
        button:active {
            background: #0369a1;
        }
        pre {
            background: #1e293b;
            padding: 15px;
            border-radius: 8px;
            text-align: left;
            font-family: monospace;
            font-size: 13px;
            max-height: 480px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            margin-top: 15px;
            border: 1px solid #334155;
        }
    </style>
</head>
<body>
    <h2>Captura Renpho R-MSC02</h2>
    <p style="font-size: 14px; color: #94a3b8;">1. Enciende la báscula con el pie.<br>2. Pulsa el botón y selecciónala.<br>3. Súbete descalzo y espera a que fije el peso.</p>
    
    <button id="btn-conectar">Conectar a la Báscula</button>
    <pre id="log">Esperando conexión...</pre>

    <script>
        const logEl = document.getElementById('log');
        function log(msg) {
            logEl.innerText += "\n" + msg;
            logEl.scrollTop = logEl.scrollHeight;
        }

        // UUIDs exactos extraídos de nRF Connect
        const SERVICE_UUID = 0x1a10;
        const CHAR_NOTIFY_UUID = 0x2a10;

        document.getElementById('btn-conectar').addEventListener('click', async () => {
            logEl.innerText = "Buscando R-MSC02...";
            try {
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'R-MSC02' }, { namePrefix: 'R-' }],
                    optionalServices: [SERVICE_UUID]
                });

                log(`Dispositivo vinculado: ${device.name}`);
                log("Conectando al servidor GATT...");
                const server = await device.gatt.connect();

                log("Accediendo al servicio 0x1A10...");
                const service = await server.getPrimaryService(SERVICE_UUID);

                log("Suscribiendo a notificaciones (0x2A10)...");
                const notifyChar = await service.getCharacteristic(CHAR_NOTIFY_UUID);
                await notifyChar.startNotifications();

                notifyChar.addEventListener('characteristicvaluechanged', (event) => {
                    const bytes = new Uint8Array(event.target.value.buffer);
                    const hex = Array.from(bytes).map(b => b.toString(16).padStart(2, '0').toUpperCase()).join(' ');
                    log(`>>> TRAMA: ${hex}`);
                });

                log("¡Suscripción lista! Súbete descalzo a la báscula.");

            } catch (err) {
                log(`ERROR: ${err.message}`);
            }
        });
    </script>
</body>
</html>
