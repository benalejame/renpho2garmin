<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renpho R-MSC02 8E [v6.8]</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #090d16;
            color: #f8fafc;
            padding: 16px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card {
            background: #1e293b;
            border-radius: 12px;
            padding: 18px;
            width: 100%;
            max-width: 440px;
            box-sizing: border-box;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            margin-bottom: 14px;
        }
        .version-badge {
            display: inline-block;
            background: #0284c7;
            color: #ffffff;
            font-size: 12px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 9999px;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        h2 { margin: 0 0 12px 0; font-size: 19px; text-align: center; }
        .form-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        label { font-size: 14px; color: #94a3b8; }
        input, select {
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 15px;
            width: 120px;
            text-align: center;
        }
        button {
            width: 100%;
            padding: 14px;
            font-size: 15px;
            font-weight: 700;
            background: #0284c7;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 8px;
        }
        button:active { background: #0369a1; }
        .display-val {
            display: flex;
            justify-content: space-around;
            text-align: center;
            margin-top: 10px;
        }
        .metric-title { font-size: 12px; color: #94a3b8; letter-spacing: 0.5px; }
        .metric-num { font-size: 28px; font-weight: bold; color: #38bdf8; margin: 4px 0; }
        .segmental-grid {
            margin-top: 14px;
            border-top: 1px solid #334155;
            padding-top: 10px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            text-align: center;
        }
        .grid-item { background: #0f172a; padding: 6px; border-radius: 6px; border: 1px solid #1e293b; }
        .grid-val { font-size: 15px; font-weight: bold; color: #f1f5f9; }
        pre {
            background: #020617;
            padding: 12px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 11px;
            max-height: 250px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            border: 1px solid #1e293b;
            color: #cbd5e1;
            margin: 0;
            width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="card" style="text-align: center;">
        <span class="version-badge">v6.8 (8 Electrodos)</span>
        <h2>Perfil Segmental</h2>
        <div class="form-row">
            <label for="gender">Sexo:</label>
            <select id="gender">
                <option value="1">Hombre</option>
                <option value="0">Mujer</option>
            </select>
        </div>
        <div class="form-row">
            <label for="height">Altura (cm):</label>
            <input type="number" id="height" value="173" min="50" max="250">
        </div>
        <div class="form-row">
            <label for="age">Edad:</label>
            <input type="number" id="age" value="53" min="5" max="120">
        </div>
        <button id="btn-conectar">Conectar e Iniciar [v6.8]</button>
    </div>

    <div class="card">
        <div class="display-val">
            <div>
                <div class="metric-title">PESO</div>
                <div class="metric-num" id="peso-val">--.-- kg</div>
            </div>
            <div>
                <div class="metric-title">IMPEDANCIA BASE</div>
                <div class="metric-num" id="imp-val">-- Ω</div>
            </div>
        </div>
        <div class="segmental-grid">
            <div class="grid-item">
                <div class="metric-title">GRASA TOTAL</div>
                <div class="grid-val" id="fat-val">--.- %</div>
            </div>
            <div class="grid-item">
                <div class="metric-title">AGUA TOTAL</div>
                <div class="grid-val" id="water-val">--.- %</div>
            </div>
            <div class="grid-item">
                <div class="metric-title">MÚSCULO</div>
                <div class="grid-val" id="muscle-val">--.- kg</div>
            </div>
            <div class="grid-item">
                <div class="metric-title">BRAZO DER.</div>
                <div class="grid-val" id="ra-val">-- Ω</div>
            </div>
            <div class="grid-item">
                <div class="metric-title">TRONCO</div>
                <div class="grid-val" id="tr-val">-- Ω</div>
            </div>
            <div class="grid-item">
                <div class="metric-title">BRAZO IZQ.</div>
                <div class="grid-val" id="la-val">-- Ω</div>
            </div>
        </div>
        <div id="status" style="text-align: center; font-size: 13px; color: #94a3b8; margin-top: 10px;">
            Desconectado
        </div>
    </div>

    <div class="card" style="padding: 10px;">
        <pre id="log">Versión v6.8 lista. Esperando conexión...</pre>
    </div>

    <script>
        const APP_VERSION = "v6.8";
        const logEl = document.getElementById('log');
        const statusEl = document.getElementById('status');
        const pesoVal = document.getElementById('peso-val');
        const impVal = document.getElementById('imp-val');
        const fatVal = document.getElementById('fat-val');
        const waterVal = document.getElementById('water-val');
        const muscleVal = document.getElementById('muscle-val');
        const raVal = document.getElementById('ra-val');
        const trVal = document.getElementById('tr-val');
        const laVal = document.getElementById('la-val');

        const genderInput = document.getElementById('gender');
        const heightInput = document.getElementById('height');
        const ageInput = document.getElementById('age');

        if (localStorage.getItem('r_gender')) genderInput.value = localStorage.getItem('r_gender');
        if (localStorage.getItem('r_height')) heightInput.value = localStorage.getItem('r_height');
        if (localStorage.getItem('r_age')) ageInput.value = localStorage.getItem('r_age');

        function log(msg) {
            logEl.innerText += "\n" + msg;
            logEl.scrollTop = logEl.scrollHeight;
        }

        const SERVICE_UUID = 0x1a10;
        const CHAR_NOTIFY_UUID = 0x2a10;
        const CHAR_WRITE_UUID = 0x2a11;

        let writeCharGlobal = null;
        let initialProfileSent = false;
        let backupProfileSent = false;
        let lastPrintedHex = "";
        let finalWeightKg = 0;

        function buildChecksum(arr) {
            let sum = 0;
            for (let b of arr) sum += b;
            arr.push(sum & 0xFF);
            return new Uint8Array(arr);
        }

        // Trama nativa de activación para 8 electrodos Chipsea/Yolanda (0x2C)
        function build8ElectrodeProfile(gender, age, height) {
            return buildChecksum([0x55, 0xAA, 0x2C, 0x00, 0x08, 0x01, gender, age, height, 0x00, 0x00, 0x01]);
        }

        async function sendProfile(reason) {
            if (!writeCharGlobal) return;
            const gender = parseInt(genderInput.value, 10);
            const height = parseInt(heightInput.value, 10);
            const age = parseInt(ageInput.value, 10);

            try {
                const pkt = build8ElectrodeProfile(gender, age, height);
                await writeCharGlobal.writeValue(pkt);
                log(`[${APP_VERSION}] Perfil 8E inyectado (${reason}): ${Array.from(pkt).map(b => b.toString(16).padStart(2,'0').toUpperCase()).join(' ')}`);
            } catch (e) {
                log(`[${APP_VERSION}] Fallo escritura (${reason}): ${e.message}`);
            }
        }

        function calculateBodyComposition(weight, height, age, gender, r) {
            const heightM = height / 100;
            const bmi = weight / (heightM * heightM);
            let fat = (1.20 * bmi) + (0.23 * age) - (10.8 * gender) - 5.4;
            if (r > 300 && r < 1200) {
                const impedanceIndex = (height * height) / r;
                fat = fat - (impedanceIndex * 0.15);
            }
            fat = Math.max(5, Math.min(50, fat));
            const fatMass = weight * (fat / 100);
            const muscle = (weight - fatMass) * 0.72;
            const water = (weight - fatMass) * 0.73;

            return {
                fat: fat.toFixed(1),
                water: water.toFixed(1),
                muscle: muscle.toFixed(1)
            };
        }

        document.getElementById('btn-conectar').addEventListener('click', async () => {
            const gender = parseInt(genderInput.value, 10);
            const height = parseInt(heightInput.value, 10);
            const age = parseInt(ageInput.value, 10);

            localStorage.setItem('r_gender', gender);
            localStorage.setItem('r_height', height);
            localStorage.setItem('r_age', age);

            logEl.innerText = `[${APP_VERSION}] Iniciando conexión...`;
            statusEl.innerText = "Buscando báscula...";
            initialProfileSent = false;
            backupProfileSent = false;
            lastPrintedHex = "";

            try {
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'R-MSC02' }, { namePrefix: 'R-' }],
                    optionalServices: [SERVICE_UUID]
                });

                device.addEventListener('gattserverdisconnected', () => {
                    log(`[${APP_VERSION}] Báscula desconectada.`);
                    statusEl.innerText = "Báscula desconectada";
                    initialProfileSent = false;
                    backupProfileSent = false;
                });

                statusEl.innerText = "Conectando GATT...";
                const server = await device.gatt.connect();

                const service = await server.getPrimaryService(SERVICE_UUID);
                const notifyChar = await service.getCharacteristic(CHAR_NOTIFY_UUID);
                writeCharGlobal = await service.getCharacteristic(CHAR_WRITE_UUID);

                await notifyChar.startNotifications();

                // 1. Handshake nativo
                try {
                    await writeCharGlobal.writeValue(new Uint8Array([0xFD, 0x37, 0x01, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x38]));
                    log(`[${APP_VERSION}] Handshake enviado.`);
                } catch (e) {}

                // 2. Envío INMEDIATO del perfil de 8 electrodos (sin esperar estabilización)
                await new Promise(r => setTimeout(r, 120));
                await sendProfile("inicio-conexión");
                initialProfileSent = true;

                statusEl.innerText = "Sujeta la barra y súbete descalzo";
                log(`[${APP_VERSION}] Perfil activo. Esperando subida a la báscula...`);

                notifyChar.addEventListener('characteristicvaluechanged', async (event) => {
                    const bytes = new Uint8Array(event.target.value.buffer);
                    const hex = Array.from(bytes).map(b => b.toString(16).padStart(2, '0').toUpperCase()).join(' ');

                    if (hex === lastPrintedHex && bytes[2] === 0x21) return;
                    lastPrintedHex = hex;

                    log(`[RX]: ${hex}`);

                    // Paquete continuo 0x21
                    if (bytes[0] === 0x55 && bytes[1] === 0xAA && bytes[2] === 0x21 && bytes.length >= 10) {
                        const rawWeight = (bytes[8] << 8) | bytes[9];
                        finalWeightKg = (rawWeight / 100).toFixed(2);
                        pesoVal.innerText = `${finalWeightKg} kg`;

                        // Reenvío preventivo al detectar primer peso humano (> 30 kg)
                        if (rawWeight > 3000 && !backupProfileSent) {
                            backupProfileSent = true;
                            log(`[${APP_VERSION}] Peso detectado (${finalWeightKg} kg). Confirmando perfil 8E...`);
                            await sendProfile("peso-detectado");
                        }
                    } 
                    // TRAMAS DE 8 ELECTRODOS / SEGMENTALES (0x2C, 0x2D, 0x2E, 0x32, etc.)
                    else if (bytes[0] === 0x55 && bytes[1] === 0xAA) {
                        log(`[${APP_VERSION}] >>> ¡TRAMA SEGMENTAL DETECTADA!: ${hex}`);
                        statusEl.innerText = "✓ Medición segmental completada";

                        if (bytes.length >= 16) {
                            const imp1 = (bytes[6] << 8) | bytes[7];
                            const imp2 = (bytes[8] << 8) | bytes[9];
                            const imp3 = (bytes[10] << 8) | bytes[11];
                            const impGlobal = (bytes[4] << 8) | bytes[5];

                            if (impGlobal > 200) impVal.innerText = `${impGlobal} Ω`;
                            if (imp1 > 100) raVal.innerText = `${imp1} Ω`;
                            if (imp2 > 10)  trVal.innerText = `${imp2} Ω`;
                            if (imp3 > 100) laVal.innerText = `${imp3} Ω`;

                            const rRef = impGlobal > 200 ? impGlobal : 500;
                            const comp = calculateBodyComposition(parseFloat(finalWeightKg || 73.0), height, age, gender, rRef);
                            fatVal.innerText = `${comp.fat} %`;
                            waterVal.innerText = `${comp.water} %`;
                            muscleVal.innerText = `${comp.muscle} kg`;
                        } else {
                            for (let i = 4; i < bytes.length - 2; i++) {
                                const val = (bytes[i] << 8) | bytes[i+1];
                                if (val >= 350 && val <= 1150) {
                                    impVal.innerText = `${val} Ω`;
                                    const comp = calculateBodyComposition(parseFloat(finalWeightKg || 73.0), height, age, gender, val);
                                    fatVal.innerText = `${comp.fat} %`;
                                    waterVal.innerText = `${comp.water} %`;
                                    muscleVal.innerText = `${comp.muscle} kg`;
                                    break;
                                }
                            }
                        }
                    }
                });

            } catch (err) {
                statusEl.innerText = "Error";
                log(`[${APP_VERSION}] ERROR: ${err.message}`);
            }
        });
    </script>
</body>
</html>
