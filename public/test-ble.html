<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lector Directo R-MSC02</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #090d16; color: white; padding: 16px; text-align: center; }
        button { padding: 15px 24px; font-size: 15px; font-weight: bold; background: #0284c7; color: white; border: none; border-radius: 10px; cursor: pointer; margin: 10px 0; }
        pre { background: #1e293b; padding: 14px; border-radius: 10px; text-align: left; font-family: monospace; font-size: 12px; max-height: 480px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; border: 1px solid #334155; }
    </style>
</head>
<body>
    <h2>Lector Directo R-MSC02 (v4)</h2>
    <p style="font-size: 13px; color: #94a3b8;">Enciende la báscula, pulsa el botón y súbete descalzo.</p>
    
    <button id="btn-scan">Iniciar Captura de Datos</button>
    
    <pre id="log">Esperando inicio...</pre>

    <script>
        const logEl = document.getElementById('log');
        let lastHexPrinted = "";

        function log(msg) {
            logEl.innerText += "\n" + msg;
            logEl.scrollTop = logEl.scrollHeight;
        }

        function bufferToHex(buffer) {
            return Array.from(new Uint8Array(buffer))
                .map(b => b.toString(16).padStart(2, '0'))
                .join(' ');
        }

        function parseAdvertisement(event) {
            let foundData = false;

            if (event.manufacturerData) {
                try {
                    event.manufacturerData.forEach((dataView, companyId) => {
                        const hex = bufferToHex(dataView.buffer);
                        if (hex !== lastHexPrinted) {
                            lastHexPrinted = hex;
                            foundData = true;
                            log(`[FABRICANTE 0x${companyId.toString(16).padStart(4, '0')}]: ${hex}`);
                        }
                    });
                } catch (e) {
                    for (let [id, val] of event.manufacturerData) {
                        const hex = bufferToHex(val.buffer);
                        if (hex !== lastHexPrinted) {
                            lastHexPrinted = hex;
                            foundData = true;
                            log(`[FABRICANTE 0x${id.toString(16)}]: ${hex}`);
                        }
                    }
                }
            }

            if (event.serviceData) {
                try {
                    event.serviceData.forEach((dataView, serviceUuid) => {
                        const hex = bufferToHex(dataView.buffer);
                        foundData = true;
                        log(`[SERVICE ${serviceUuid}]: ${hex}`);
                    });
                } catch (e) {}
            }

            if (!foundData && event.data) {
                log(`[RAW DATA]: ${bufferToHex(event.data.buffer)}`);
            }
        }

        document.getElementById('btn-scan').addEventListener('click', async () => {
            logEl.innerText = "Iniciando escáner BLE...";
            lastHexPrinted = "";

            if (navigator.bluetooth.requestLEScan) {
                try {
                    log("Usando requestLEScan()...");
                    navigator.bluetooth.addEventListener('advertisementreceived', parseAdvertisement);
                    await navigator.bluetooth.requestLEScan({
                        acceptAllAdvertisements: true,
                        keepRepeatedDevices: true
                    });
                    log("Escaneando continuamente. Súbete a la báscula...");
                    return;
                } catch (err) {
                    log("requestLEScan falló (" + err.message + "). Probando watchAdvertisements...");
                }
            }

            try {
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true
                });

                log(`Dispositivo vinculado: ${device.name || 'R-MSC02'}`);
                device.addEventListener('advertisementreceived', parseAdvertisement);
                await device.watchAdvertisements();
                log("Observador activado. Súbete descalzo a la báscula...");

            } catch (err) {
                log("ERROR: " + err.message);
            }
        });
    </script>
</body>
</html>
