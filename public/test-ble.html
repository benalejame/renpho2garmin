<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renpho R-MSC02 8E [v7.9]</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #090d16;
            color: #f8fafc;
            padding: 16px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card {
            background: #1e293b;
            border-radius: 12px;
            padding: 18px;
            width: 100%;
            max-width: 440px;
            box-sizing: border-box;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            margin-bottom: 14px;
        }
        .version-badge {
            display: inline-block;
            background: #0284c7;
            color: #ffffff;
            font-size: 12px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 9999px;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        h2 { margin: 0 0 12px 0; font-size: 19px; text-align: center; }
        .form-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        label { font-size: 14px; color: #94a3b8; }
        input, select {
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 15px;
            width: 120px;
            text-align: center;
        }
        button {
            width: 100%;
            padding: 14px;
            font-size: 15px;
            font-weight: 700;
            background: #0284c7;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 8px;
        }
        button:active { background: #0369a1; }
        .display-val {
            display: flex;
            justify-content: space-around;
            text-align: center;
            margin-top: 10px;
        }
        .metric-title { font-size: 12px; color: #94a3b8; letter-spacing: 0.5px; }
        .metric-num { font-size: 28px; font-weight: bold; color: #38bdf8; margin: 4px 0; }
        .segmental-grid {
            margin-top: 14px;
            border-top: 1px solid #334155;
            padding-top: 10px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            text-align: center;
        }
        .grid-item { background: #0f172a; padding: 6px; border-radius: 6px; border: 1px solid #1e293b; }
        .grid-val { font-size: 15px; font-weight: bold; color: #f1f5f9; }
        pre {
            background: #020617;
            padding: 12px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 11px;
            max-height: 280px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            border: 1px solid #1e293b;
            color: #cbd5e1;
            margin: 0;
            width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="card" style="text-align: center;">
        <span class="version-badge">v7.9 (Dual Notify & Indicate)</span>
        <h2>Perfil Segmental</h2>
        <div class="form-row">
            <label for="gender">Sexo:</label>
            <select id="gender">
                <option value="1">Hombre</option>
                <option value="0">Mujer</option>
            </select>
        </div>
        <div class="form-row">
            <label for="height">Altura (cm):</label>
            <input type="number" id="height" value="173" min="50" max="250">
        </div>
        <div class="form-row">
            <label for="age">Edad:</label>
            <input type="number" id="age" value="53" min="5" max="120">
        </div>
        <button id="btn-conectar">Conectar e Iniciar [v7.9]</button>
    </div>

    <div class="card">
        <div class="display-val">
            <div>
                <div class="metric-title">PESO FINAL</div>
                <div class="metric-num" id="peso-val">--.-- kg</div>
            </div>
            <div>
                <div class="metric-title">IMPEDANCIA BIA</div>
                <div class="metric-num" id="imp-val">-- Ω</div>
            </div>
        </div>
        <div class="segmental-grid">
            <div class="grid-item">
                <div class="metric-title">GRASA TOTAL</div>
                <div class="grid-val" id="fat-val">--.- %</div>
            </div>
            <div class="grid-item">
                <div class="metric-title">AGUA TOTAL</div>
                <div class="grid-val" id="water-val">--.- %</div>
            </div>
            <div class="grid-item">
                <div class="metric-title">MÚSCULO</div>
                <div class="grid-val" id="muscle-val">--.- kg</div>
            </div>
            <div class="grid-item">
                <div class="metric-title">BRAZO DER.</div>
                <div class="grid-val" id="ra-val">-- Ω</div>
            </div>
            <div class="grid-item">
                <div class="metric-title">TRONCO</div>
                <div class="grid-val" id="tr-val">-- Ω</div>
            </div>
            <div class="grid-item">
                <div class="metric-title">BRAZO IZQ.</div>
                <div class="grid-val" id="la-val">-- Ω</div>
            </div>
        </div>
        <div id="status" style="text-align: center; font-size: 13px; color: #94a3b8; margin-top: 10px;">
            Desconectado
        </div>
    </div>

    <div class="card" style="padding: 10px;">
        <pre id="log">Versión v7.9 lista. Esperando conexión...</pre>
    </div>

    <script>
        const APP_VERSION = "v7.9";
        const logEl = document.getElementById('log');
        const statusEl = document.getElementById('status');
        const pesoVal = document.getElementById('peso-val');
        const impVal = document.getElementById('imp-val');
        const fatVal = document.getElementById('fat-val');
        const waterVal = document.getElementById('water-val');
        const muscleVal = document.getElementById('muscle-val');
        const raVal = document.getElementById('ra-val');
        const trVal = document.getElementById('tr-val');
        const laVal = document.getElementById('la-val');

        const genderInput = document.getElementById('gender');
        const heightInput = document.getElementById('height');
        const ageInput = document.getElementById('age');

        if (localStorage.getItem('r_gender')) genderInput.value = localStorage.getItem('r_gender');
        if (localStorage.getItem('r_height')) heightInput.value = localStorage.getItem('r_height');
        if (localStorage.getItem('r_age')) ageInput.value = localStorage.getItem('r_age');

        function log(msg) {
            logEl.innerText += "\n" + msg;
            logEl.scrollTop = logEl.scrollHeight;
        }

        const SERVICE_UUID = 0x1a10;

        let writeCharGlobal = null;
        let b3Sent = false;
        let b2Sent = false;
        let lastPrintedHex = "";
        let finalWeightKg = 0;
        let plateauCount = 0;
        let prevWeightRaw = 0;

        const PKT_INIT_FD = new Uint8Array([0xFD, 0x37, 0x06, 0x00, 0x14, 0x75, 0x00, 0x01, 0x12, 0x81, 0x23, 0xA5, 0xB7, 0x00, 0x00, 0x00]);
        const PKT_B3_INIT = new Uint8Array([0x55, 0xAA, 0xB3, 0x00, 0x0B, 0x01, 0x07, 0x01, 0x01, 0x6A, 0xBD, 0x26, 0xF3, 0x00, 0x78, 0x00, 0x7F]);
        const PKT_B2_INIT = new Uint8Array([0x55, 0xAA, 0xB2, 0x00, 0x09, 0x00, 0x01, 0x06, 0xCC, 0x1C, 0x4D, 0xB5, 0x07, 0x02, 0xB4]);
        const PKT_ACK_B6_FRAME1 = new Uint8Array([0x55, 0xAA, 0xB6, 0x00, 0x02, 0x01, 0x01, 0xB9]);
        const PKT_ACK_B6_FRAME2 = new Uint8Array([0x55, 0xAA, 0xB6, 0x00, 0x02, 0x02, 0x01, 0xBA]);

        function calculateBodyComposition(weight, height, age, gender, r) {
            const heightM = height / 100;
            const bmi = weight / (heightM * heightM);
            let fat = (1.20 * bmi) + (0.23 * age) - (10.8 * gender) - 5.4;
            if (r > 300 && r < 1200) {
                const impedanceIndex = (height * height) / r;
                fat = fat - (impedanceIndex * 0.15);
            }
            fat = Math.max(5, Math.min(50, fat));
            const fatMass = weight * (fat / 100);
            const muscle = (weight - fatMass) * 0.72;
            const water = (weight - fatMass) * 0.73;

            return {
                fat: fat.toFixed(1),
                water: water.toFixed(1),
                muscle: muscle.toFixed(1)
            };
        }

        async function writePacket(pkt, name) {
            if (!writeCharGlobal) return;
            try {
                if (writeCharGlobal.writeValueWithResponse) {
                    await writeCharGlobal.writeValueWithResponse(pkt);
                } else {
                    await writeCharGlobal.writeValue(pkt);
                }
                log(`[${APP_VERSION}] [TX] ${name}`);
            } catch (e) {
                try {
                    await writeCharGlobal.writeValue(pkt);
                    log(`[${APP_VERSION}] [TX Fallback] ${name}`);
                } catch (err2) {
                    log(`[${APP_VERSION}] Error TX ${name}: ${err2.message}`);
                }
            }
        }

        async function sendB2Packet(reason) {
            if (b2Sent) return;
            b2Sent = true;
            await writePacket(PKT_B2_INIT, `B2 (${reason})`);
            statusEl.innerText = "Midiendo electrodos... Mantén firme la barra";
        }

        async function handleIncomingBytes(bytes, charUuid) {
            const hex = Array.from(bytes).map(b => b.toString(16).padStart(2, '0').toUpperCase()).join(' ');

            if (hex === lastPrintedHex && bytes[2] === 0x21) return;
            lastPrintedHex = hex;

            log(`[RX]: ${hex}`);

            // 1. TRAMA DINÁMICA 0x21 (Peso dinámico)
            if (bytes[0] === 0x55 && bytes[1] === 0xAA && bytes[2] === 0x21 && bytes.length >= 10) {
                const rawWeight = (bytes[8] << 8) | bytes[9];
                finalWeightKg = (rawWeight / 100).toFixed(2);
                pesoVal.innerText = `${finalWeightKg} kg`;

                // Umbral universal: > 20 kg
                if (rawWeight > 2000 && !b3Sent) {
                    if (Math.abs(rawWeight - prevWeightRaw) <= 35) {
                        plateauCount++;
                    } else {
                        plateauCount = 0;
                    }
                    prevWeightRaw = rawWeight;

                    if (plateauCount >= 2) {
                        b3Sent = true;
                        statusEl.innerText = "Peso estabilizado. Enviando B3...";
                        log(`[${APP_VERSION}] Meseta confirmada (${finalWeightKg} kg). Enviando B3...`);
                        await writePacket(PKT_B3_INIT, "B3 (Meseta)");

                        // Fallback si la confirmación no llega a tiempo
                        setTimeout(() => {
                            if (!b2Sent) sendB2Packet("fallback-timer");
                        }, 120);
                    }
                }
            }
            // 2. TRAMA 0x20: Recibida habitualmente por Indication
            else if (bytes[0] === 0x55 && bytes[1] === 0xAA && bytes[2] === 0x20) {
                log(`[${APP_VERSION}] Confirmación 0x20 detectada.`);
                await sendB2Packet("evento-0x20");
            }
            // 3. TRAMA 0x26: Frames segmentales durante la animación
            else if (bytes[0] === 0x55 && bytes[1] === 0xAA && bytes[2] === 0x26) {
                const frameId = bytes[5];
                log(`[${APP_VERSION}] >>> Frame 0x26 (${frameId}) detectado.`);
                statusEl.innerText = "Escaneando segmentos corporales...";

                if (frameId === 0x01) {
                    await writePacket(PKT_ACK_B6_FRAME1, "ACK B6 Frame 1");
                } else if (frameId === 0x02) {
                    await writePacket(PKT_ACK_B6_FRAME2, "ACK B6 Frame 2");
                }
            }
            // 4. TRAMA FINAL 0x25: Entrega completa de bioimpedancia
            else if (bytes[0] === 0x55 && bytes[1] === 0xAA && (bytes[2] === 0x25 || bytes.length >= 15)) {
                log(`[${APP_VERSION}] >>> ¡TRAMA BIA FINAL RECIBIDA!: ${hex}`);
                statusEl.innerText = "✓ Medición completada con éxito";

                const gender = parseInt(genderInput.value, 10);
                const height = parseInt(heightInput.value, 10);
                const age = parseInt(ageInput.value, 10);

                const rawW = (bytes[8] << 8) | bytes[9];
                if (rawW > 2000) {
                    finalWeightKg = (rawW / 100).toFixed(2);
                    pesoVal.innerText = `${finalWeightKg} kg`;
                }

                // Extracción Little-Endian de las impedancias segmentales
                const rawR1 = bytes[12] | (bytes[13] << 8);
                const rawR2 = bytes[14] | (bytes[15] << 8);

                const rBrazoDer = Math.round(rawR1 / 6);
                const rBrazoIzq = Math.round(rawR2 / 6);

                raVal.innerText = `${rBrazoDer} Ω`;
                laVal.innerText = `${rBrazoIzq} Ω`;
                impVal.innerText = `${rBrazoDer} Ω`;

                const comp = calculateBodyComposition(parseFloat(finalWeightKg || 73.2), height, age, gender, rBrazoDer);
                fatVal.innerText = `${comp.fat} %`;
                waterVal.innerText = `${comp.water} %`;
                muscleVal.innerText = `${comp.muscle} kg`;

                const pktFinal = new Uint8Array([0x55, 0xAA, 0xB2, 0x00, 0x09, 0x02, 0x01, 0x06, 0xCC, bytes[8], bytes[9], 0xB5, 0x07, 0x02, 0x06]);
                await writePacket(pktFinal, "Cierre final B2");
            }
        }

        document.getElementById('btn-conectar').addEventListener('click', async () => {
            const gender = parseInt(genderInput.value, 10);
            const height = parseInt(heightInput.value, 10);
            const age = parseInt(ageInput.value, 10);

            localStorage.setItem('r_gender', gender);
            localStorage.setItem('r_height', height);
            localStorage.setItem('r_age', age);

            logEl.innerText = `[${APP_VERSION}] Iniciando conexión...`;
            statusEl.innerText = "Buscando báscula...";
            b3Sent = false;
            b2Sent = false;
            plateauCount = 0;
            prevWeightRaw = 0;
            lastPrintedHex = "";

            try {
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'R-MSC02' }, { namePrefix: 'R-' }],
                    optionalServices: [SERVICE_UUID]
                });

                device.addEventListener('gattserverdisconnected', () => {
                    log(`[${APP_VERSION}] Báscula desconectada.`);
                    statusEl.innerText = "Báscula desconectada";
                    b3Sent = false;
                    b2Sent = false;
                });

                statusEl.innerText = "Conectando GATT...";
                const server = await device.gatt.connect();

                const service = await server.getPrimaryService(SERVICE_UUID);
                const characteristics = await service.getCharacteristics();
                log(`[${APP_VERSION}] Características descubiertas: ${characteristics.length}`);

                // Suscripción universal a todas las características con notify o indicate
                for (let ch of characteristics) {
                    const props = ch.properties;
                    const uuid16 = ch.uuid.substring(4, 8);

                    if (props.notify || props.indicate) {
                        try {
                            await ch.startNotifications();
                            log(`[${APP_VERSION}] Escuchando ${uuid16} (notify:${props.notify}, indicate:${props.indicate})`);
                            ch.addEventListener('characteristicvaluechanged', (evt) => {
                                const bytes = new Uint8Array(evt.target.value.buffer);
                                handleIncomingBytes(bytes, uuid16);
                            });
                        } catch (errSub) {
                            log(`[${APP_VERSION}] Fallo al suscribir ${uuid16}: ${errSub.message}`);
                        }
                    }

                    if (props.write || props.writeWithoutResponse) {
                        writeCharGlobal = ch;
                    }
                }

                // Saludo inicial FD 37
                await writePacket(PKT_INIT_FD, "Saludo FD 37");

                statusEl.innerText = "Sujeta la barra y súbete descalzo";
                log(`[${APP_VERSION}] Listo para medir. Súbete a la báscula...`);

            } catch (err) {
                statusEl.innerText = "Error";
                log(`[${APP_VERSION}] ERROR: ${err.message}`);
            }
        });
    </script>
</body>
</html>
