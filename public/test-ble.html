<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renpho R-MSC02 Bridge [v6.0]</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #090d16;
            color: #f8fafc;
            padding: 16px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card {
            background: #1e293b;
            border-radius: 12px;
            padding: 18px;
            width: 100%;
            max-width: 440px;
            box-sizing: border-box;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            margin-bottom: 14px;
        }
        .badge {
            display: inline-block;
            background: #0284c7;
            color: white;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 9999px;
            margin-bottom: 6px;
        }
        h2 { margin: 0 0 12px 0; font-size: 19px; text-align: center; }
        .form-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        label { font-size: 14px; color: #94a3b8; }
        input, select {
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 15px;
            width: 120px;
            text-align: center;
        }
        button {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            font-weight: 700;
            background: #0284c7;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 8px;
        }
        button:active { background: #0369a1; }
        .display-val {
            display: flex;
            justify-content: space-around;
            text-align: center;
            margin-top: 10px;
        }
        .metric-title { font-size: 12px; color: #94a3b8; letter-spacing: 0.5px; }
        .metric-num { font-size: 30px; font-weight: bold; color: #38bdf8; margin: 4px 0; }
        pre {
            background: #020617;
            padding: 12px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 11px;
            max-height: 250px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            border: 1px solid #1e293b;
            color: #cbd5e1;
            margin: 0;
            width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="card" style="text-align: center;">
        <span class="badge">v6.0</span>
        <h2>Configuración de Usuario</h2>
        <div class="form-row">
            <label for="gender">Sexo:</label>
            <select id="gender">
                <option value="1">Hombre</option>
                <option value="0">Mujer</option>
            </select>
        </div>
        <div class="form-row">
            <label for="height">Altura (cm):</label>
            <input type="number" id="height" value="173" min="50" max="250">
        </div>
        <div class="form-row">
            <label for="age">Edad:</label>
            <input type="number" id="age" value="53" min="5" max="120">
        </div>
        <button id="btn-conectar">Conectar e Iniciar [v6.0]</button>
    </div>

    <div class="card">
        <div class="display-val">
            <div>
                <div class="metric-title">PESO</div>
                <div class="metric-num" id="peso-val">--.-- kg</div>
            </div>
            <div>
                <div class="metric-title">IMPEDANCIA (BIA)</div>
                <div class="metric-num" id="imp-val">-- Ω</div>
            </div>
        </div>
        <div id="status" style="text-align: center; font-size: 13px; color: #94a3b8; margin-top: 10px;">
            Desconectado
        </div>
    </div>

    <div class="card" style="padding: 10px;">
        <pre id="log">Versión v6.0 lista. Esperando conexión...</pre>
    </div>

    <script>
        const APP_VERSION = "v6.0";
        const logEl = document.getElementById('log');
        const statusEl = document.getElementById('status');
        const pesoVal = document.getElementById('peso-val');
        const impVal = document.getElementById('imp-val');

        const genderInput = document.getElementById('gender');
        const heightInput = document.getElementById('height');
        const ageInput = document.getElementById('age');

        if (localStorage.getItem('r_gender')) genderInput.value = localStorage.getItem('r_gender');
        if (localStorage.getItem('r_height')) heightInput.value = localStorage.getItem('r_height');
        if (localStorage.getItem('r_age')) ageInput.value = localStorage.getItem('r_age');

        function log(msg) {
            logEl.innerText += "\n" + msg;
            logEl.scrollTop = logEl.scrollHeight;
        }

        const SERVICE_UUID = 0x1a10;
        const CHAR_NOTIFY_UUID = 0x2a10;
        const CHAR_WRITE_UUID = 0x2a11;

        let writeCharGlobal = null;
        let profileSentForCurrentWeight = false;
        let lastPrintedHex = "";

        // Trama de activación en estabilización
        function buildTriggerPayload(gender, age, height) {
            // Cabecera interactiva estándar Chipsea/Yolanda 0x11
            const p = [0x55, 0xAA, 0x11, 0x00, 0x05, 0x01, gender, age, height, 0x01];
            let sum = 0;
            for (let i = 0; i < p.length; i++) sum += p[i];
            p.push(sum & 0xFF);
            return new Uint8Array(p);
        }

        document.getElementById('btn-conectar').addEventListener('click', async () => {
            const gender = parseInt(genderInput.value, 10);
            const height = parseInt(heightInput.value, 10);
            const age = parseInt(ageInput.value, 10);

            localStorage.setItem('r_gender', gender);
            localStorage.setItem('r_height', height);
            localStorage.setItem('r_age', age);

            logEl.innerText = `[${APP_VERSION}] Iniciando conexión...`;
            statusEl.innerText = "Buscando báscula...";
            profileSentForCurrentWeight = false;
            lastPrintedHex = "";

            try {
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'R-MSC02' }, { namePrefix: 'R-' }],
                    optionalServices: [SERVICE_UUID]
                });

                device.addEventListener('gattserverdisconnected', () => {
                    log(`[${APP_VERSION}] Báscula desconectada.`);
                    statusEl.innerText = "Báscula desconectada";
                    profileSentForCurrentWeight = false;
                });

                statusEl.innerText = "Conectando GATT...";
                const server = await device.gatt.connect();

                const service = await server.getPrimaryService(SERVICE_UUID);
                const notifyChar = await service.getCharacteristic(CHAR_NOTIFY_UUID);
                writeCharGlobal = await service.getCharacteristic(CHAR_WRITE_UUID);

                await notifyChar.startNotifications();

                // Handshake mínimo inicial
                try {
                    await writeCharGlobal.writeValue(new Uint8Array([0x02, 0x00, 0x00, 0x02]));
                    log(`[${APP_VERSION}] Handshake 0x02 enviado.`);
                } catch (e) {}

                statusEl.innerText = "Súbete descalzo a la báscula";
                log(`[${APP_VERSION}] Esperando peso para enviar comando BIA interactivo...`);

                notifyChar.addEventListener('characteristicvaluechanged', async (event) => {
                    const bytes = new Uint8Array(event.target.value.buffer);
                    const hex = Array.from(bytes).map(b => b.toString(16).padStart(2, '0').toUpperCase()).join(' ');

                    if (hex === lastPrintedHex && bytes[2] === 0x21) return;
                    lastPrintedHex = hex;

                    log(`[RX]: ${hex}`);

                    if (bytes[0] === 0x55 && bytes[1] === 0xAA && bytes[2] === 0x21 && bytes.length >= 10) {
                        const rawWeight = (bytes[8] << 8) | bytes[9];
                        const wKg = (rawWeight / 100).toFixed(2);
                        pesoVal.innerText = `${wKg} kg`;

                        // Detección directa en flujo continuo si viene con datos
                        const impDirect = (bytes[6] << 8) | bytes[7];
                        if (impDirect > 0) {
                            impVal.innerText = `${impDirect} Ω`;
                        }

                        // DETECCIÓN DE PESO ESTABILIZADO (bytes[5] == 0x01 y peso > 10 kg)
                        if (bytes[5] === 0x01 && rawWeight > 1000 && !profileSentForCurrentWeight) {
                            profileSentForCurrentWeight = true;
                            statusEl.innerText = "Peso fijado. Activando BIA...";
                            log(`[${APP_VERSION}] Peso fijo (${wKg} kg). Enviando perfil a 0x2A11...`);

                            try {
                                const triggerPkt = buildTriggerPayload(gender, age, height);
                                await writeCharGlobal.writeValue(triggerPkt);
                                log(`[${APP_VERSION}] Inyección BIA enviada: ${Array.from(triggerPkt).map(b => b.toString(16).padStart(2, '0').toUpperCase()).join(' ')}`);
                            } catch (errW) {
                                log(`[${APP_VERSION}] Error enviando perfil: ${errW.message}`);
                            }
                        }
                    } 
                    // TRAMA DE RESPUESTA A LA ACTIVACIÓN O TRAMA FINAL
                    else if (bytes[0] === 0x55 && bytes[1] === 0xAA) {
                        log(`[${APP_VERSION}] >>> TRAMA ESPECIAL RECIBIDA: ${hex}`);
                        statusEl.innerText = "✓ Trama de análisis recibida";

                        for (let i = 4; i < bytes.length - 2; i++) {
                            const val = (bytes[i] << 8) | bytes[i+1];
                            if (val >= 350 && val <= 1100) {
                                impVal.innerText = `${val} Ω`;
                                log(`[${APP_VERSION}] -> Impedancia detectada: ${val} Ω`);
                                break;
                            }
                        }
                    }
                });

            } catch (err) {
                statusEl.innerText = "Error";
                log(`[${APP_VERSION}] ERROR: ${err.message}`);
            }
        });
    </script>
</body>
</html>
